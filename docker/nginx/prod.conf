# Prod: static files from the baked public/ dir, PHP to the "app" service.
# TLS terminates in front of this container (load balancer / cloudflared / Caddy).
map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;

    # Resolve upstreams through Docker DNS at request time, so recreated containers
    # (new IPs) are picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 12m;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        # public/index.php lives in the app container at the same path.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) { deny all; }
}
