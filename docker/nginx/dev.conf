# Dev: one https hostname (the tunnel) in front of two separate apps, told apart by path:
# the backend (nginx -> php-fpm, app:9000) and the frontend (Vite dev server, node:5173).
# One hostname because the app runs inside the Shopify admin iframe and a quick tunnel gives one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Only the shop's own admin may frame the app; a request without a valid shop may not be framed.
map $arg_shop $frame_ancestors {
    default                                   "'none'";
    "~^[a-zA-Z0-9][a-zA-Z0-9-]*\.myshopify\.com$" "https://$arg_shop https://admin.shopify.com";
}

server {
    listen 80;
    server_name _;

    # Resolve upstreams through Docker DNS at request time, so recreated containers
    # (new IPs) are picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    set $vite_upstream http://node:5173;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 12m;

    # --- Vite dev server (HMR) ---
    # The backend: API, webhooks and the few pages Laravel answers itself. Everything else is
    # the frontend, a separate app (in production it has its own domain; in dev one tunnel
    # hostname fronts both and this proxy tells them apart by path).
    location ~ ^/(api|webhooks|flow|horizon|vendor|auth|up|privacy|support)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    # Vite's module paths, matched before the dot-file rule below (/node_modules/.vite/...).
    location ~ ^/(@vite|@id|@fs|@react-refresh|node_modules|src|__vite_hmr)(/|$) {
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # The frontend (Vite dev server): its page for every route.
    location / {
        # Iframe protection per shop, as the frontend's web server sends it in production.
        add_header Content-Security-Policy "frame-ancestors $frame_ancestors;" always;
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Behind cloudflared the original scheme is https.
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) { deny all; }
}

map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https   on;
}
