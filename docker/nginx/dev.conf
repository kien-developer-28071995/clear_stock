# Dev: nginx -> php-fpm (app:9000). Vite dev assets + HMR websocket are proxied to
# the node container so everything is served from ONE https origin (the tunnel).
# That is required because the app runs inside the Shopify admin iframe (https).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Resolve upstreams through Docker DNS at request time, so recreated containers
    # (new IPs) are picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    set $vite_upstream http://node:5173;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 12m;

    # --- Vite dev server (HMR) ---
    location ~ ^/(@vite|@id|@fs|@react-refresh|node_modules|src|__vite_hmr)(/|$) {
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Behind cloudflared the original scheme is https.
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) { deny all; }
}

map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https   on;
}
