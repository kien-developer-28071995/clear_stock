api_version = "2026-07"

# "More actions" on the Shopify product and variant pages: mark the product as ordered outside
# Shopify (email, phone, supplier portal) with the suggested quantities, so Clear Stock counts it
# as on the way and stops suggesting it. POST /api/extension/manual-orders.
[[extensions]]
type = "ui_extension"
name = "t:name"
handle = "product-order-action"
uid = "6f2c1e9a-3b7d-4c55-9a1e-2d8f4b7c0e13"

  [[extensions.targeting]]
  target = "admin.product-details.action.render"
  module = "./src/ProductOrderAction.tsx"

  [[extensions.targeting]]
  target = "admin.product-variant-details.action.render"
  module = "./src/ProductOrderAction.tsx"
