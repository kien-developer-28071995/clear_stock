# Build the production images once, push them to GitHub Container Registry, and roll them out
# on the server over SSH (deploy/deploy.sh). Setup: docs/DEPLOY.md.
#
# - Automatic after CI passes on main. Pending migrations run automatically when they only add
#   (tables, columns, indexes); ones that drop/rename/change stop the deploy for a manual run.
#   Variable AUTO_MIGRATE=false turns automatic migrations off (then every one needs migrate = true).
# - Manual (Actions -> Deploy -> Run workflow): run migrations, roll back to an earlier image tag,
#   or tag = "current" to only apply changed Secrets/Variables (app/backend/.env) to the running version.
# - app/backend/.env is built from GitHub Secrets/Variables of the `production` environment
#   (deploy/envtool.py) once APP_KEY is a Secret; until then the server keeps its own file.
# - The website (website/) is built here from the same Variables (WEBSITE_URL, SUPPORT_EMAIL, ...)
#   and uploaded to <deploy dir>/website, which Caddy serves (deploy/Caddyfile). Skipped until the
#   WEBSITE_URL Variable is set, and on rollbacks (tag input).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Run every pending migration, also ones that drop or change (additive ones run anyway unless AUTO_MIGRATE=false)
        type: boolean
        default: false
      tag:
        description: Deploy an existing image tag instead of building (rollback), e.g. sha-1a2b3c4, or "current" to only apply config changes
        type: string
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/clear_stock

jobs:
  build:
    # Automatic runs only when CI succeeded; manual rollbacks skip the build.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app (PHP-FPM, Horizon, scheduler)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-app:${{ steps.tag.outputs.tag }},${{ env.IMAGE_PREFIX }}-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build and push web (nginx + frontend build)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ steps.tag.outputs.tag }},${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build and push admin (owner reports)
        uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-admin:${{ steps.tag.outputs.tag }},${{ env.IMAGE_PREFIX }}-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  deploy:
    needs: build
    # Also runs for a manual rollback (build skipped).
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    # Settings -> Environments -> production: add required reviewers to approve every deploy.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The backend, the frontend build and Shopify must all mean the same app: with another app's
      # key every API call answers 401 and the merchant only sees "Your session expired".
      - name: SHOPIFY_API_KEY is the app in shopify.app.production.toml
        env:
          API_KEY: ${{ vars.SHOPIFY_API_KEY || secrets.SHOPIFY_API_KEY }}
        run: |
          client_id=$(sed -n 's/^client_id *= *"\(.*\)"/\1/p' shopify.app.production.toml)
          if [ -n "$API_KEY" ] && [ "$API_KEY" != "$client_id" ]; then
            echo "::error::SHOPIFY_API_KEY (environment production) is not the client_id in shopify.app.production.toml (${client_id:0:8}...). Set SHOPIFY_API_KEY and SHOPIFY_API_SECRET to that app's credentials."
            exit 1
          fi
      - name: Build app/backend/.env from Secrets and Variables
        id: env
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: python3 deploy/envtool.py render --out "$RUNNER_TEMP/backend.env"
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose file and deploy script
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.DEPLOY_PORT || 22 }}" \
            docker-compose.prod.yml deploy/deploy.sh deploy/admin-setup.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
      - name: Copy app/backend/.env (deploy.sh switches to it)
        if: steps.env.outputs.managed == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/app/backend'"
          scp -p -i ~/.ssh/id_deploy -P "${{ secrets.DEPLOY_PORT || 22 }}" "$RUNNER_TEMP/backend.env" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/app/backend/.env.incoming"
          rm -f "$RUNNER_TEMP/backend.env"
      - name: Roll out
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}' bash deploy.sh '${{ inputs.tag || needs.build.outputs.tag }}' ${{ inputs.migrate && '--migrate' || (vars.AUTO_MIGRATE != 'false' && '--migrate=auto' || '') }}"
      # The app's frontend: a static site on its own domain (FRONTEND_URL), published apart from the
      # backend containers. It goes to FRONTEND_DEPLOY_* when those secrets exist (its own server),
      # else next to the backend. After the backend, so a new page never calls an older API.
      - uses: actions/setup-node@v5
        if: inputs.tag == ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Build the app frontend
        if: inputs.tag == ''
        working-directory: app/frontend
        env:
          VITE_API_URL: ${{ vars.APP_URL }}
          VITE_SHOPIFY_API_KEY: ${{ vars.SHOPIFY_API_KEY || secrets.SHOPIFY_API_KEY }}
          VITE_APP_NAME: ${{ vars.SHOPIFY_APP_NAME || 'Clear Stock' }}
          VITE_WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          VITE_CRISP_WEBSITE_ID: ${{ vars.CRISP_WEBSITE_ID }}
        run: npm ci && npm run build && npm run build:check
      - name: Publish the app frontend (swapped in whole)
        if: inputs.tag == ''
        env:
          HOST: ${{ secrets.FRONTEND_DEPLOY_HOST || secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.FRONTEND_DEPLOY_USER || secrets.DEPLOY_USER }}
          PORT: ${{ secrets.FRONTEND_DEPLOY_PORT || secrets.DEPLOY_PORT || 22 }}
          TARGET: ${{ secrets.FRONTEND_DEPLOY_PATH || secrets.DEPLOY_PATH }}
          KNOWN_HOSTS: ${{ secrets.FRONTEND_DEPLOY_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}
        run: |
          key=~/.ssh/id_deploy
          if [ -n "$SSH_KEY" ]; then key=~/.ssh/id_frontend; echo "$SSH_KEY" > "$key"; chmod 600 "$key"; fi
          if [ -n "$KNOWN_HOSTS" ]; then echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts; fi
          tar -C app/frontend/dist -czf "$RUNNER_TEMP/frontend.tgz" .
          scp -i "$key" -P "$PORT" "$RUNNER_TEMP/frontend.tgz" "$SSH_USER@$HOST:$TARGET/frontend.tgz"
          ssh -i "$key" -p "$PORT" "$SSH_USER@$HOST" \
            "cd '$TARGET' && rm -rf frontend.new frontend.old && mkdir frontend.new && tar -xzf frontend.tgz -C frontend.new && rm frontend.tgz && chmod -R a+rX frontend.new && { [ ! -d frontend ] || mv frontend frontend.old; } && mv frontend.new frontend && rm -rf frontend.old"
      # The live split, as a browser meets it: the frontend's page with the iframe protection
      # header for a shop, and the API on the backend's domain answering a cross-origin preflight.
      - name: Check the live frontend and API
        if: inputs.tag == ''
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          API_URL: ${{ vars.APP_URL }}
        run: |
          page=$(curl -fsS -D "$RUNNER_TEMP/h" "$FRONTEND_URL/?shop=check.myshopify.com&embedded=1")
          echo "$page" | grep -q 'name="shopify-api-key"' || { echo "::error::$FRONTEND_URL does not serve the app's page"; exit 1; }
          tr -d '\r' < "$RUNNER_TEMP/h" | grep -qi '^content-security-policy: frame-ancestors https://check.myshopify.com https://admin.shopify.com' \
            || { echo "::error::$FRONTEND_URL does not send the frame-ancestors header for the shop (deploy/Caddyfile)"; exit 1; }
          curl -fsS -o /dev/null -X OPTIONS -H "Origin: $FRONTEND_URL" -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization' -D "$RUNNER_TEMP/c" "$API_URL/api/shop"
          tr -d '\r' < "$RUNNER_TEMP/c" | grep -qi '^access-control-allow-origin:' || { echo "::error::$API_URL/api does not answer cross-origin requests"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/shop")" = 401 ] || { echo "::error::$API_URL/api/shop should refuse a call without a session token (401)"; exit 1; }
      - uses: actions/setup-node@v5
        if: inputs.tag == '' && vars.WEBSITE_URL != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the website
        if: inputs.tag == '' && vars.WEBSITE_URL != ''
        working-directory: website
        env:
          SITE_URL: ${{ vars.WEBSITE_URL }}
          APP_NAME: ${{ vars.SHOPIFY_APP_NAME || 'Clear Stock' }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          INSTALL_URL: ${{ vars.INSTALL_URL }}
          CRISP_WEBSITE_ID: ${{ vars.CRISP_WEBSITE_ID }}
          GROWTH_OFFERED: ${{ vars.BILLING_GROWTH_OFFERED || 'false' }}
        run: npm ci && npm run build
      - name: Publish the website (swapped in whole, so visitors never see half a site)
        if: inputs.tag == '' && vars.WEBSITE_URL != ''
        run: |
          tar -C website/dist -czf "$RUNNER_TEMP/website.tgz" .
          scp -i ~/.ssh/id_deploy -P "${{ secrets.DEPLOY_PORT || 22 }}" "$RUNNER_TEMP/website.tgz" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/website.tgz"
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && rm -rf website.new website.old && mkdir website.new && tar -xzf website.tgz -C website.new && rm website.tgz && chmod -R a+rX website.new && { [ ! -d website ] || mv website website.old; } && mv website.new website && rm -rf website.old"
