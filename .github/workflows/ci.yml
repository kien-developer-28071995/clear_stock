# Tests on every push and pull request. Deploy (deploy.yml) only runs after this passes on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, gd, zip, pdo_sqlite, redis
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      # Tests use SQLite in memory and array cache/queue (phpunit.xml): no services needed.
      - name: Tests (Pest)
        run: php artisan test

  # The same suite on MySQL, the engine production runs: SQLite forgives what MySQL does not
  # (values too large for a column, rows tied on a timestamp, JSON key order).
  backend-mysql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clear_stock_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, gd, zip, pdo_mysql, redis
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tests on MySQL
        run: php artisan test -c phpunit.mysql.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit -p .
        working-directory: frontend
      - name: Translations (keys and plurals in sync)
        run: npm run i18n:check
        working-directory: frontend
      - name: Admin extension locales copied from the app
        run: node extensions/scripts/sync-locales.mjs --check
      - name: Build (static site, as the Deploy workflow publishes it)
        run: npm run build && npm run build:check
        working-directory: frontend
        env:
          VITE_API_URL: https://api.example.test
          VITE_SHOPIFY_API_KEY: ci-build

  # Marketing website (website/): translations, types and the static build.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Translations and type check
        run: npm run check
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://www.ci.example.test

  # Production images build on every push and pull request (not pushed anywhere), so a broken
  # Dockerfile shows up before merge. Deploy (deploy.yml) builds and pushes them from main,
  # sharing this layer cache.
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [app, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # Owner reports (admin/): plain Laravel, its own dependencies; tests use SQLite in memory.
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-admin-${{ hashFiles('admin/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test
      - uses: docker/setup-buildx-action@v3
      - name: Build the admin image
        uses: docker/build-push-action@v6
        with:
          context: admin
          push: false
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  # backend/.env template renders (deploy/envtool.py) with every required value present.
  # The web servers in front of the app, run for real: nginx configs parse, and the Caddyfile's
  # frontend block sends the iframe protection header per shop and serves client-side routes.
  web-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash deploy/check-web-config.sh

  env-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render with placeholder values
        env:
          SECRETS_JSON: '{"APP_KEY":"base64:ci","SHOPIFY_API_KEY":"k","SHOPIFY_API_SECRET":"s","DB_PASSWORD":"p","DB_ROOT_PASSWORD":"r","HORIZON_BASIC_AUTH_USER":"u","HORIZON_BASIC_AUTH_PASSWORD":"p"}'
          VARS_JSON: '{"APP_URL":"https://ci.example.test","MAIL_HOST":"smtp.ci.test","MAIL_FROM_ADDRESS":"a@ci.test","SUPPORT_EMAIL":"s@ci.test","WEBSITE_URL":"https://www.ci.example.test","FRONTEND_URL":"https://app.ci.example.test"}'
        run: python3 deploy/envtool.py render --out "$RUNNER_TEMP/backend.env"
