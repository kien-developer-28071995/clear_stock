# Tests on every push and pull request. Deploy (deploy.yml) only runs after this passes on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, gd, zip, pdo_sqlite, redis
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      # Tests use SQLite in memory and array cache/queue (phpunit.xml): no services needed.
      - name: Tests (Pest)
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit -p .
        working-directory: frontend
      - name: Translations (keys and plurals in sync)
        run: npm run i18n:check
        working-directory: frontend
      - name: Admin extension locales copied from the app
        run: node extensions/scripts/sync-locales.mjs --check
      - name: Build
        run: npm run build
        working-directory: frontend
