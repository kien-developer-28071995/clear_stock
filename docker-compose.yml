# Development stack. Usage: `make up` (see Makefile / README).
name: clear_stock_dev

x-php: &php
  build:
    context: .
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: clear_stock-php-dev
  # No env_file: Laravel reads the mounted app/backend/.env itself, so edits apply without recreating containers.
  volumes:
    - ./app/backend:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./app/backend/public:/var/www/html/public:ro
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - node

  mysql:
    image: mysql:8.4
    # Reads app/backend/.env (same DB credentials as Laravel) and maps them to MYSQL_* vars.
    env_file: app/backend/.env
    entrypoint:
      - sh
      - -c
      - >-
        export MYSQL_DATABASE="$$DB_DATABASE" MYSQL_USER="$$DB_USERNAME"
        MYSQL_PASSWORD="$$DB_PASSWORD" MYSQL_ROOT_PASSWORD="$$DB_ROOT_PASSWORD"
        && exec docker-entrypoint.sh mysqld
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Frontend (app/frontend/, reads app/frontend/.env): Vite dev server + HMR.
  # Writes app/backend/public/hot so Laravel loads dev assets, hence both dirs are mounted.
  node:
    image: node:22-alpine
    working_dir: /app/frontend
    user: "${UID:-1000}:${GID:-1000}"
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    volumes:
      - ./app/frontend:/app/frontend
      - ./app/backend/public:/app/backend/public
      - ./app/backend/resources/views:/app/backend/resources/views:ro
    environment:
      npm_config_cache: /app/frontend/.npm-cache

  # Marketing website (website/, reads website/.env): Astro dev server, http://localhost:4321.
  # The app's /privacy and /support redirect here (WEBSITE_URL in app/backend/.env).
  website:
    image: node:22-alpine
    working_dir: /app/website
    user: "${UID:-1000}:${GID:-1000}"
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --port 4321"]
    ports:
      - "${FORWARD_WEBSITE_PORT:-4321}:4321"
    volumes:
      - ./website:/app/website
    environment:
      npm_config_cache: /app/website/.npm-cache

  # Owner reports (admin/, plain Laravel + Blade, reads admin/.env): http://localhost:8090, this
  # machine only. Reads the app's database (APPDB_* in admin/.env) and keeps its own SQLite file.
  # First run: `make admin-setup`.
  admin:
    image: clear_stock-php-dev
    working_dir: /var/www/admin
    user: "${UID:-1000}:${GID:-1000}"
    command: ["sh", "-c", "touch database/database.sqlite && php artisan migrate --force && (php artisan schedule:work &) && exec php artisan serve --host=0.0.0.0 --port=8090"]
    ports:
      - "127.0.0.1:${FORWARD_ADMIN_PORT:-8090}:8090"
    volumes:
      - ./admin:/var/www/admin
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

  # Public HTTPS URL for Shopify (OAuth, webhooks, embedded iframe).
  # Quick tunnel: random https://*.trycloudflare.com URL on every start (`make tunnel`).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    depends_on:
      - nginx

  # Named tunnel with a stable hostname: set TUNNEL_TOKEN in app/backend/.env (`make tunnel`).
  tunnel-named:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-named"]
    env_file: app/backend/.env   # cloudflared reads TUNNEL_TOKEN from the environment
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      - nginx

volumes:
  mysql-data:
  redis-data:
