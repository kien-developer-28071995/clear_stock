# Shopify app configuration (https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration)
# Push changes with:  npx @shopify/cli@latest app deploy
# application_url / redirect_urls are rewritten by `make tunnel` (docker/scripts/set-app-url.sh).

client_id = "585d48be540225310586b5df5dc1348e"
name = "Clear Stock"
application_url = "https://host-enlargement-systematic-instrumentation.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# Why each scope is needed: see README "Access scopes".
# DEV ONLY: write_orders is needed by `php artisan dev:fake-orders` (fake orders in the dev store).
# REMOVE write_orders before App Store submission (Phase 7 checklist) - the app itself is read-only.
scopes = "read_products,read_inventory,read_locations,read_orders,read_all_orders,read_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,write_orders"
# Optional: asked in the app only when a Growth merchant first creates a draft transfer
# from the Transfers page (App Bridge shopify.scopes.request). Not needed to install.
optional_scopes = [ "write_inventory_transfers" ]
# Shopify-managed installation: Shopify shows the consent screen on install,
# the app gets tokens via token exchange (no OAuth redirect dance).
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://host-enlargement-systematic-instrumentation.trycloudflare.com/auth/callback" ]

[webhooks]
api_version = "2026-07"

  # All topics go to one endpoint; the backend routes by X-Shopify-Topic.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled", "app/scopes_update", "app_subscriptions/update", "bulk_operations/finish" ]
  uri = "/webhooks"

  # Mandatory for App Store apps (GDPR / privacy law compliance).
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"
